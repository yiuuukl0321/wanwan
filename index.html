<!-- 弯弯 · 发完自动回复 -->
<script>
(function () {
  var busy = false;
  function replyBtn(){ return document.querySelector('.chat-reply-btn, .chat-action-reply'); }
  function fire(n){
    var b = replyBtn();
    if (b && b.offsetParent !== null && !b.disabled) {
      busy = true; b.click();
      setTimeout(function(){ busy = false; }, 1500);
      return;
    }
    if (n > 0) setTimeout(function(){ fire(n - 1); }, 300);
  }
  function onSend(){
    if (busy) return;
    if (!document.querySelector('.chat-window-page')) return;
    var before = document.querySelectorAll('.msg-row.msg-self').length;
    setTimeout(function(){
      var after = document.querySelectorAll('.msg-row.msg-self').length;
      if (after > before) fire(10);
    }, 500);
  }
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t && t.closest && t.closest('.chat-action-send')) onSend();
  }, true);
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.shiftKey) return;
    var t = e.target;
    if (t && t.closest && t.closest('.chat-input')) onSend();
  }, true);
})();
</script>
<!-- 弯弯 · 视觉模型 + ElevenLabs 语音 -->
<script>
(function () {
  var _fetch = window.fetch.bind(window);
  var _chatId = null;

  function get(k){ return db.config.get(k).then(function(r){ return (r && r.value) || null }) }
  function set(k,v){ return db.config.put({ key: k, value: v }) }
  function toast(m){ if (window.toast) window.toast(m) }
  function pick(sel){ var el = document.querySelector(sel); return el ? el.dataset : null }

  function currentChatId() {
    if (_chatId) return _chatId;
    var d = pick('#call-page') || pick('#chat-window');
    if (!d) return null;
    return d.chatId || d.callChatId || d.chatid || null;
  }

  /* ========== 1. 带图的请求自动换成视觉模型 ========== */
  window.fetch = function (input, init) {
    try {
      var url = typeof input === 'string' ? input : (input && input.url) || '';
      var body = init && typeof init.body === 'string' ? init.body : '';
      if (body && url.indexOf('/chat/completions') !== -1 && body.indexOf('"image_url"') !== -1) {
        return get('kaiVisionApi').then(function (v) {
          if (!v || !v.model) return _fetch(input, init);
          var obj = JSON.parse(body);
          obj.model = v.model;
          var next = Object.assign({}, init, { body: JSON.stringify(obj) });
          next.headers = Object.assign({}, init.headers || {});
          if (v.key) next.headers['Authorization'] = 'Bearer ' + v.key;
          var base = String(v.url || '').replace(/\/+$/, '');
          return _fetch(base ? base + '/chat/completions' : url, next);
        });
      }
    } catch (e) {}
    return _fetch(input, init);
  };

  /* ========== 2. TTS：优先 ElevenLabs，失败回退 Minimax ========== */
  function installTTS() {
    var H = window._wechatCallHelpers;
    var _tts = (H && typeof H.callMinimaxTTS === 'function')
      ? H.callMinimaxTTS
      : window.callMinimaxTTS;
    if (typeof _tts !== 'function') return false;

    var wrapped = async function (text, voiceId) {
      try {
        var cfg = await get('kaiElevenLabs');
        var cid = currentChatId();
        var vid = cid ? await get('chatVoiceIdEleven_' + cid) : null;
        if (!vid && cfg) vid = cfg.voiceId;
        if (cfg && cfg.key && vid) {
          var res = await _fetch('https://api.elevenlabs.io/v1/text-to-speech/' + vid + '?output_format=mp3_44100_128', {
            method: 'POST',
            headers: { 'xi-api-key': cfg.key, 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text, model_id: cfg.model || 'eleven_multilingual_v2' })
          });
          if (res.ok) return URL.createObjectURL(await res.blob());
          console.warn('ElevenLabs ' + res.status + '，回退 Minimax');
        }
      } catch (err) { console.warn('ElevenLabs 失败，回退 Minimax', err); }
      return _tts.apply(this, arguments);
    };

    if (H) H.callMinimaxTTS = wrapped;
    if (typeof window.callMinimaxTTS === 'function') window.callMinimaxTTS = wrapped;
    return true;
  }
  if (!installTTS()) {
    var t = setInterval(function () { if (installTTS()) clearInterval(t) }, 800);
  }

  /* 通话时抓住当前 chatId，才能知道用哪个角色的音色 */
  ['startVoiceCall', 'startVideoCall'].forEach(function (name) {
    var fn = window[name];
    if (typeof fn !== 'function') return;
    window[name] = function (chatId, charId, initiator) {
      _chatId = chatId;
      return fn.apply(this, arguments);
    };
  });

  /* ========== 3. 设置页新增「视觉模型 / ElevenLabs」入口 ========== */
  function panel() {
    var ov = document.createElement('div');
    ov.className = 'sheet-overlay show';
    var m = document.createElement('div');
    m.className = 'center-modal show';
    m.innerHTML = '<div class="sheet-title">视觉 & 语音</div>' +
      '<div style="padding:0 16px;display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto">' +
      '<input class="input-field" id="kv-url" placeholder="视觉 Base URL（如 https://.../v1）">' +
      '<input class="input-field" id="kv-key" placeholder="视觉 API Key">' +
      '<input class="input-field" id="kv-model" placeholder="视觉模型，如 google/gemini-2.0-flash-001">' +
      '<input class="input-field" id="ke-key" placeholder="ElevenLabs API Key">' +
      '<input class="input-field" id="ke-voice" placeholder="ElevenLabs 默认 Voice ID">' +
      '<input class="input-field" id="ke-model" placeholder="ElevenLabs 模型，默认 eleven_multilingual_v2">' +
      '</div><div class="sheet-actions"><button class="btn-pill btn-full" id="k-save">保存</button></div>';
    document.body.appendChild(ov); document.body.appendChild(m);
    Promise.all([get('kaiVisionApi'), get('kaiElevenLabs')]).then(function (r) {
      var v = r[0] || {}, e = r[1] || {};
      m.querySelector('#kv-url').value = v.url || '';
      m.querySelector('#kv-key').value = v.key || '';
      m.querySelector('#kv-model').value = v.model || '';
      m.querySelector('#ke-key').value = e.key || '';
      m.querySelector('#ke-voice').value = e.voiceId || '';
      m.querySelector('#ke-model').value = e.model || '';
    });
    function close(){ ov.remove(); m.remove() }
    ov.addEventListener('click', close);
    m.querySelector('#k-save').addEventListener('click', async function () {
      await set('kaiVisionApi', {
        url: m.querySelector('#kv-url').value.trim(),
        key: m.querySelector('#kv-key').value.trim(),
        model: m.querySelector('#kv-model').value.trim()
      });
      await set('kaiElevenLabs', {
        key: m.querySelector('#ke-key').value.trim(),
        voiceId: m.querySelector('#ke-voice').value.trim(),
        model: m.querySelector('#ke-model').value.trim()
      });
      toast('已保存'); close();
    });
  }

  function injectSettingRow() {
    if (document.getElementById('kai-media-row')) return;
    var rows = document.querySelectorAll('.list-row, .setting-row');
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].textContent.indexOf('Minimax') === -1) continue;
      var row = rows[i].cloneNode(true);
      row.id = 'kai-media-row';
      row.querySelectorAll('[id]').forEach(function (el) { el.removeAttribute('id') });
      var l = row.querySelector('.row-label'); if (l) l.textContent = '视觉模型 / ElevenLabs';
      var s = row.querySelector('.row-sub'); if (s) s.textContent = '读图模型 + 语音合成';
      row.addEventListener('click', panel);
      rows[i].parentNode.insertBefore(row, rows[i].nextSibling);
      return;
    }
  }

  /* ========== 4. 聊天设置里新增「ElevenLabs 语音」音色栏 ========== */
  function injectVoiceSection() {
    if (document.getElementById('cs-eleven-voice-id')) return;
    var mini = document.getElementById('cs-voice-id');
    if (!mini) return;
    var sec = mini.closest('.cs-section');
    if (!sec) return;
    var page = mini.closest('.full-page') || document;
    var chatId = (page.dataset && page.dataset.chatId) || currentChatId();
    if (!chatId) return;
    _chatId = chatId;

    var clone = sec.cloneNode(true);
    clone.querySelectorAll('[id]').forEach(function (el) { el.removeAttribute('id') });
    var label = clone.querySelector('.cs-section-label');
    if (label) label.textContent = 'ElevenLabs 语音';
    var sub = clone.querySelector('.cs-section-sub');
    if (sub) sub.textContent = '填入 ElevenLabs Voice ID，优先用它；留空回退 Minimax';
    var input = clone.querySelector('input');
    if (!input) return;
    input.id = 'cs-eleven-voice-id';
    input.placeholder = '输入 ElevenLabs Voice ID';
    get('chatVoiceIdEleven_' + chatId).then(function (v) { input.value = v || '' });
    input.addEventListener('change', function () {
      var val = input.value.trim();
      if (!val) {
        db.config.delete('chatVoiceIdEleven_' + chatId);
        toast('已清空，这个角色回退 Minimax');
        return;
      }
      set('chatVoiceIdEleven_' + chatId, val).then(function () {
        toast('ElevenLabs 音色已保存');
      });
    });
    sec.parentNode.insertBefore(clone, sec.nextSibling);
  }

  new MutationObserver(function () { injectSettingRow(); injectVoiceSection(); })
    .observe(document.body, { childList: true, subtree: true });
  injectSettingRow();
  injectVoiceSection();
})();
</script>


<!-- 弯弯 · 消息朗读按钮 -->
<style>
.kai-spk{position:absolute;bottom:0;width:24px;height:24px;padding:0;border:0;background:transparent;
  color:var(--c-hint,#a8a8a8);display:flex;align-items:center;justify-content:center;z-index:5;
  -webkit-tap-highlight-color:transparent}
.kai-spk svg{width:13px;height:13px;fill:currentColor}
.kai-spk:active{opacity:.6}
.kai-spk.on{color:var(--c-accent,#5b7cff)}
.kai-spk.on rect{transform-box:fill-box;transform-origin:center;animation:kaiEq .9s ease-in-out infinite}
.kai-spk.on rect:nth-child(2){animation-delay:.15s}
.kai-spk.on rect:nth-child(3){animation-delay:.3s}
.kai-spk.on rect:nth-child(4){animation-delay:.45s}
@keyframes kaiEq{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.kai-spk-right{right:-25px}
.kai-spk-left{left:-25px}
</style>
<script>
(function () {
  var _audio = null, _btn = null, _tick = null;

  function toast(m){ if (window.toast) window.toast(m) }
  function svg(){ return '<svg viewBox="0 0 24 24"><rect x="2.5" y="10" width="2.6" height="4" rx="1.3"/><rect x="7.8" y="7" width="2.6" height="10" rx="1.3"/><rect x="13.1" y="4.5" width="2.6" height="15" rx="1.3"/><rect x="18.4" y="9" width="2.6" height="6" rx="1.3"/></svg>' }

  function stopSpeak() {
    if (_audio) { try { _audio.pause() } catch (e) {} _audio = null }
    if (_btn) { _btn.classList.remove('on'); _btn = null }
  }

  async function speak(el, btn) {
    var text = (el.innerText || '').replace(/\s+/g, ' ').trim();
    if (!text) return;
    if (text.length > 400) text = text.slice(0, 400);

    var H = window._wechatCallHelpers || {};
    var fn = (typeof H.callMinimaxTTS === 'function') ? H.callMinimaxTTS : window.callMinimaxTTS;
    if (typeof fn !== 'function') { toast('语音合成不可用'); return }

    var win = document.getElementById('chat-window');
    var chatId = win && win.dataset ? win.dataset.chatId : null;
    var voiceId = null;
    if (chatId) {
      var row = await db.config.get('chatVoiceId_' + chatId);
      voiceId = row && row.value;
    }

    stopSpeak();
    try {
      var url = await fn(text, voiceId);
      if (!url) { toast('合成失败，先去聊天设置填音色'); return }
      _audio = new Audio(url);
      _btn = btn;
      btn.classList.add('on');
      _audio.addEventListener('ended', stopSpeak);
      await _audio.play();
    } catch (e) {
      console.warn('朗读失败', e);
      stopSpeak();
      toast('朗读失败，点一下屏幕再试');
    }
  }

  var SEL = '[class*="bubble"],[class*="msg-content"],[class*="message-text"],[class*="msg-text"],[class*="chat-text"]';

  function attach() {
    var win = document.getElementById('chat-window');
    if (!win) return;
    var winRight = win.getBoundingClientRect().right;

    win.querySelectorAll(SEL).forEach(function (el) {
      if (el.dataset.kaiSpk === '1') return;
      if (el.querySelector('.kai-spk')) return;
      var text = (el.innerText || '').trim();
      if (!text || text.length < 1) return;
      if (/^\[.*\]$/.test(text)) return;            // 图片/位置/通话这类占位气泡不挂

      el.dataset.kaiSpk = '1';
      if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
      if (getComputedStyle(el).overflow === 'hidden') el.style.overflow = 'visible';

      var mine = el.getBoundingClientRect().right > winRight - 60;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'kai-spk ' + (mine ? 'kai-spk-left' : 'kai-spk-right');
      btn.setAttribute('aria-label', '朗读');
      btn.innerHTML = svg();
      ['pointerdown', 'touchstart', 'mousedown'].forEach(function (t) {
        btn.addEventListener(t, function (e) { e.stopPropagation() }, { passive: true });
      });
      btn.addEventListener('click', function (e) {
        e.stopPropagation(); e.preventDefault();
        if (_btn === btn) { stopSpeak(); return }
        speak(el, btn);
      });
      el.appendChild(btn);
    });
  }

  function schedule() {
    if (_tick) return;
    _tick = requestAnimationFrame(function () { _tick = null; attach() });
  }

  new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true });
  document.addEventListener('click', function (e) {
    if (e.target.closest('.header-back, .chat-back, .page-header')) stopSpeak();
  }, true);
  schedule();
})();
</script>
